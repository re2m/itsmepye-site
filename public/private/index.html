<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Private</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#FFF8EF;--card:#fff;--ink:#2B2118;--sub:#7A6A5C;--line:#EFE2D2;--accent:#F28C28;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:40px 20px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px}
p{color:var(--sub);font-size:14px;margin:0 0 24px}
a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:10px;color:var(--ink);text-decoration:none}
a.card:active{border-color:var(--accent)}
.e{font-size:28px}
b{display:block;font-size:16px}
small{color:var(--sub);font-size:13px}
.arr{margin-left:auto;color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>🔒 Private</h1>
  <p>나만 보는 페이지 모음</p>
  <a class="card" href="/private/budget/">
    <span class="e">📒</span>
    <span><b>내 가계부</b><small>수입·지출 기록과 예산 관리</small></span>
    <span class="arr">›</span>
  </a>
</main>
</body>
</html>
