<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>로그인 — Private</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#FFF8EF;--card:#fff;--ink:#2B2118;--sub:#7A6A5C;--line:#EFE2D2;--accent:#F28C28;--warn:#C2410C;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
main{max-width:400px;margin:0 auto;padding:18vh 24px 40px;text-align:center}
.lock{font-size:48px}
h1{font-size:24px;margin:12px 0 6px;letter-spacing:-.5px}
p{color:var(--sub);font-size:14px;margin:0 0 28px}
input{width:100%;font:inherit;font-size:17px;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none;text-align:center}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;border:0;border-radius:14px;padding:16px;font:inherit;font-size:16px;font-weight:800;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.err{color:var(--warn);font-size:14px;font-weight:600;min-height:20px;margin-top:12px}
</style>
</head>
<body>
<main>
  <div class="lock">🔒</div>
  <h1>나만 보는 공간</h1>
  <p>비밀번호를 입력해 주세요</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" autofocus required>
    <button id="go">들어가기</button>
    <div class="err" id="err"></div>
  </form>
</main>
<script>
const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
const next = (() => {
  const n = new URLSearchParams(location.search).get('next') || '';
  return /^\/private(\/|$)/.test(n) && !n.startsWith('/private/login') ? n : '/private/';
})();
f.onsubmit = async e => {
  e.preventDefault();
  go.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/private/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw.value }),
    });
    if (r.ok) { location.replace(next); return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.error === 'wrong_password' ? '비밀번호가 맞지 않아요' :
      j.error === 'not_configured' ? '서버에 비밀번호가 아직 설정되지 않았어요' : '잠시 후 다시 시도해 주세요';
    pw.select();
  } catch (_) {
    err.textContent = '인터넷 연결을 확인해 주세요';
  }
  go.disabled = false;
};
</script>
</body>
</html>
